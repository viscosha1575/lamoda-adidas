services:
  traefik:
    image: traefik:v3.6
    container_name: lamoda-traefik
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 256
    environment:
      DOCKER_API_VERSION: "1.44"
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.transport.respondingtimeouts.readtimeout=15s
      - --entrypoints.web.transport.respondingtimeouts.writetimeout=15s
      - --entrypoints.web.transport.respondingtimeouts.idletimeout=60s
      - --entrypoints.websecure.transport.respondingtimeouts.readtimeout=30s
      - --entrypoints.websecure.transport.respondingtimeouts.writetimeout=30s
      - --entrypoints.websecure.transport.respondingtimeouts.idletimeout=120s
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/acme.json:/letsencrypt/acme.json
    networks:
      - web

  postgres:
    image: postgres:16-alpine
    container_name: lamoda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  server:
    build:
      context: ../server
    container_name: lamoda-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      CORS_ORIGINS: https://${DOMAIN},https://${ADMIN_DOMAIN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_GAME_BOT_TOKEN: ${TELEGRAM_GAME_BOT_TOKEN}
      ADMIN_TELEGRAM_BOT_TOKEN: ${ADMIN_TELEGRAM_BOT_TOKEN}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS}
      TELEGRAM_TRUST_CLIENT_USER: ${TELEGRAM_TRUST_CLIENT_USER}
      TELEGRAM_APP_URL: ${TELEGRAM_APP_URL}
      TELEGRAM_SUBSCRIPTION_CHAT_ID: ${TELEGRAM_SUBSCRIPTION_CHAT_ID}
      TELEGRAM_SUBSCRIPTION_URL: ${TELEGRAM_SUBSCRIPTION_URL}
      REQUEST_BODY_SECRET: ${REQUEST_BODY_SECRET}
      AUTH_TOKEN_TTL_DAYS: ${AUTH_TOKEN_TTL_DAYS}
      GAME_DURATION_SECONDS: ${GAME_DURATION_SECONDS}
      HEARTBEAT_GRACE_SECONDS: ${HEARTBEAT_GRACE_SECONDS}
      PLAYER_ONLINE_WINDOW_SECONDS: ${PLAYER_ONLINE_WINDOW_SECONDS}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=lamoda_web
      - traefik.http.routers.lamoda-api.rule=(Host(`${DOMAIN}`) || Host(`${ADMIN_DOMAIN}`)) && PathPrefix(`/api`)
      - traefik.http.routers.lamoda-api.entrypoints=websecure
      - traefik.http.routers.lamoda-api.tls=true
      - traefik.http.routers.lamoda-api.tls.certresolver=letsencrypt
      - traefik.http.routers.lamoda-api.priority=100
      - traefik.http.routers.lamoda-api.middlewares=lamoda-api-ratelimit@docker,lamoda-api-inflight@docker,lamoda-api-retry@docker
      - traefik.http.middlewares.lamoda-api-ratelimit.ratelimit.average=30
      - traefik.http.middlewares.lamoda-api-ratelimit.ratelimit.burst=60
      - traefik.http.middlewares.lamoda-api-ratelimit.ratelimit.period=1s
      - traefik.http.middlewares.lamoda-api-inflight.inflightreq.amount=80
      - traefik.http.middlewares.lamoda-api-retry.retry.attempts=2
      - traefik.http.middlewares.lamoda-api-retry.retry.initialinterval=100ms
      - traefik.http.services.lamoda-api.loadbalancer.server.port=3001
    networks:
      - web
      - internal

  game:
    build:
      context: ../game
      args:
        VITE_API_URL: /api
    container_name: lamoda-game
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=lamoda_web
      - traefik.http.routers.lamoda-web.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.lamoda-web.entrypoints=websecure
      - traefik.http.routers.lamoda-web.tls=true
      - traefik.http.routers.lamoda-web.tls.certresolver=letsencrypt
      - traefik.http.services.lamoda-web.loadbalancer.server.port=80
    networks:
      - web

  admin:
    build:
      context: ../admin
      args:
        REQUEST_BODY_SECRET: ${REQUEST_BODY_SECRET}
    container_name: lamoda-admin
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=lamoda_web
      - traefik.http.routers.lamoda-admin.rule=Host(`${ADMIN_DOMAIN}`)
      - traefik.http.routers.lamoda-admin.entrypoints=websecure
      - traefik.http.routers.lamoda-admin.tls=true
      - traefik.http.routers.lamoda-admin.tls.certresolver=letsencrypt
      - traefik.http.services.lamoda-admin.loadbalancer.server.port=80
    networks:
      - web

volumes:
  postgres_data:

networks:
  web:
    name: lamoda_web
  internal:
    name: lamoda_internal
