name: Deploy Production

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            admin/package-lock.json
            game/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run server tests
        working-directory: server
        run: npm test

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci --legacy-peer-deps

      - name: Build admin
        working-directory: admin
        run: npm run build

      - name: Install game dependencies
        working-directory: game
        run: npm ci

      - name: Lint game
        working-directory: game
        run: npm run lint

      - name: Build game
        working-directory: game
        run: npm run build

  deploy:
    name: Deploy to production
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          password: ${{ secrets.PROD_PASSWORD }}
          port: ${{ secrets.PROD_PORT }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /opt/lamoda-adidas
            git fetch --all --prune
            git checkout main
            git pull --ff-only origin main
            docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml up -d --build
            docker image prune -f

      - name: Check public API health
        run: |
          curl -fsS --retry 20 --retry-delay 3 --retry-all-errors https://lamoda-specials.ru/api/health | grep '"status":"ok"'

      - name: Check game frontend
        run: |
          curl -fsS --retry 20 --retry-delay 3 --retry-all-errors https://lamoda-specials.ru/ > /tmp/lamoda-game.html
          grep -qi '<!doctype html' /tmp/lamoda-game.html

      - name: Check admin frontend
        run: |
          curl -fsS --retry 20 --retry-delay 3 --retry-all-errors https://admin.lamoda-specials.ru/ > /tmp/lamoda-admin.html
          grep -qi '<!doctype html' /tmp/lamoda-admin.html
